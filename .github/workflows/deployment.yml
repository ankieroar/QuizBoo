name: Register Cloudflare Deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deployment:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://troll-quiz-room.12a01-quiz.workers.dev/

    steps:
      - name: Verify the live Cloudflare deployment
        run: |
          curl --fail --silent --show-error --max-time 15 \
            https://troll-quiz-room.12a01-quiz.workers.dev/api/health
